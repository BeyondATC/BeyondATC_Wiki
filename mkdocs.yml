site_name: BeyondATC Help Center
site_url: https://wiki.beyondatc.net
copyright: Created with 💜 by Dialex
theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.png
  font: 
    text: Albert Sans
  features:
  - content.code.annotate
  - content.code.copy
  - content.tabs.link
  - navigation.footer
  - navigation.indexes
  - navigation.sections
  - navigation.tabs
  - navigation.top
  - navigation.tracking
  - navigation.instant
  - search.highlight
  - search.share
  - search.suggest
  - toc.integrate
  - instant

  palette:
    # Dark mode
    - scheme: batc-dark
      accent: deep purple

  logo: assets/logo.png

extra_css:
  - stylesheets/extra.css
  - stylesheets/spantable.css

markdown_extensions:
  admonition: {}
  pymdownx.details: {}
  pymdownx.superfences: {}
  def_list: {}
  attr_list: {}
  md_in_html: {}
  tables: {}
  pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
  pymdownx.tabbed:
    alternate_style: true
  neoteroi.spantable: {}

plugins:
  - search
  # Redirect for old links..
  # Beginner Guide became the IFR tab
  # VFR knowledge-base page became the VFR tab.
  - redirects:
      redirect_maps:
        'beginner-guide/index.md': 'ifr/overview.md'
        'beginner-guide/overview.md': 'ifr/overview.md'
        'beginner-guide/preflight.md': 'ifr/preflight.md'
        'beginner-guide/departure.md': 'ifr/departure.md'
        'beginner-guide/cruise.md': 'ifr/cruise.md'
        'beginner-guide/arrival.md': 'ifr/arrival.md'
        'knowledge-base/vfr.md': 'vfr/index.md'
        'knowledge-base/vfr-stage-two.md': 'vfr/index.md'
  - meta-descriptions:
      export_csv: false
      quiet: false
      enable_checks: false
      min_length: 50
      max_length: 160
      trim: false
  
nav:
  - Home: 'index.md'
  - Onboarding:
    - 'Overview': 'onboarding/overview.md'
    - 'Features': 'onboarding/features.md'
    - 'Pricing': 'onboarding/pricing.md'
    - 'Getting started': 'onboarding/getting-started.md'
  - IFR:
    - 'Overview': 'ifr/overview.md'
    - 'Preflight': 'ifr/preflight.md'
    - 'Departure': 'ifr/departure.md'
    - 'Cruise': 'ifr/cruise.md'
    - 'Arrival': 'ifr/arrival.md'
  - VFR:
    - 'vfr/index.md'
    - 'Setting Up Your Flight': 'vfr/setting-up.md'
    - By region:
      - 'United States': 'vfr/united-states.md'
      - 'United Kingdom': 'vfr/united-kingdom.md'
      - 'Australia': 'vfr/australia.md'
    - Everywhere:
      - 'Uncontrolled Fields & Aerodrome Services': 'vfr/uncontrolled-fields.md'
      - 'Radios & COM2': 'vfr/radios.md'
      - 'Circuit Holds, Go-Arounds & Changes': 'vfr/sequencing-and-holds.md'
      - 'Callsigns & Squawks': 'vfr/callsigns-and-squawks.md'
      - 'Quick Reference': 'vfr/quick-reference.md'
  - Knowledge Base:
    - 'knowledge-base/index.md'
    - 'Toolbar': 'knowledge-base/toolbar.md'
    - CPDLC:
      - 'CPDLC' : 'knowledge-base/cpdlc.md'
      - 'Fenix A320 Family' : 'knowledge-base/cpdlc-a320fenix.md'
  - Resources:
    - 'Resources': 'resources/index.md'
  - Support:
    - 'Bug reporting': 'support/bug-reporting.md'
    - 'FAQ': 'support/faq.md'
    - 'Common issues':
      - "Stuck in the login screen": 'support/common-issues/stucklogin.md'
      - "Fatal error": 'support/common-issues/fatal.md'
      - "BeyondATC update failed": 'support/common-issues/update.md'
      - "Connection issues": 'support/common-issues/simconnect.md'
      - "Change the output device": 'support/common-issues/output.md'
      - "No AI traffic": 'support/common-issues/notraffic.md'
      - "Simbrief cannot be reached": 'support/common-issues/simbrief.md'

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/beyondatc